{# name, id, label, autocomplete, extra attrs via optional placeholder #}
<label for="{{ id }}">{{ label }}</label>
<div class="pw-wrap">
  <input type="password" name="{{ name }}" id="{{ id }}"
         autocomplete="{{ autocomplete or 'current-password' }}"
         required
         {% if placeholder %}placeholder="{{ placeholder }}"{% endif %}>
  <button type="button" class="pw-eye" data-pw="{{ id }}" aria-label="Show password" title="Show password">
    <svg class="eye-on" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
    <svg class="eye-off" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" hidden>
      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94"/>
      <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19"/>
      <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
      <line x1="1" y1="1" x2="23" y2="23"/>
    </svg>
  </button>
</div>
